<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SaaS Product Portal - Your business tools and applications in one place">
    <meta name="theme-color" content="#0F4C5C">
    <title>Product Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230F4C5C'/><text x='50' y='68' text-anchor='middle' font-size='50' fill='white' font-family='system-ui'>P</text></svg>">
    <style>
        /* ============================================================
           CSS VARIABLES
           ============================================================ */
        :root {
            --primary: #0F4C5C;
            --primary-hover: #0A1628;
            --accent: #E8B931;
            --success: #4ADE80;

            --background: #FFFFFF;
            --surface: #F8F9FA;
            --surface-hover: #F0F1F2;

            --border: #E5E7EB;
            --border-light: #EEEEEE;
            --border-strong: #DDDDDD;

            --text-primary: #000000;
            --text-secondary: #0F4C5C;
            --text-muted: #AAAAAA;

            --header-background: #FFFFFF;

            --white: #FFFFFF;
            --white-transparent: rgba(255, 255, 255, 0.6);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.07), 0 4px 8px rgba(0,0,0,0.04);
            --shadow-xl: 0 12px 40px rgba(0,0,0,0.09), 0 4px 12px rgba(0,0,0,0.04);

            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 350ms cubic-bezier(0.4, 0, 0.2, 1);

            --max-content-width: 1320px;
            --header-height: 72px;
        }

        /* ============================================================
           GLOBAL STYLES
           ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
        }

        /* ============================================================
           ANIMATED BACKGROUND CANVAS
           ============================================================ */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-height);
            background: var(--header-background);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.92);
        }

        .header-inner {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 40px);
            height: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-logo-placeholder {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-logo-placeholder svg {
            width: 22px;
            height: 22px;
        }

        .header-name {
            font-size: clamp(16px, 2vw, 20px);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - var(--header-height));
            display: flex;
            flex-direction: column;
        }

        .content-wrapper {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 40px);
            width: 100%;
            flex: 1;
        }

        /* ============================================================
           WELCOME SECTION
           ============================================================ */
        .welcome {
            padding: clamp(32px, 5vw, 56px) 0 clamp(24px, 4vw, 40px);
            text-align: center;
        }

        .welcome-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(15, 76, 92, 0.06);
            border: 1px solid rgba(15, 76, 92, 0.1);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .welcome-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .welcome-title {
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 12px;
        }

        .welcome-title span {
            color: var(--primary);
        }

        .welcome-subtitle {
            font-size: clamp(15px, 2vw, 18px);
            color: var(--text-muted);
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ============================================================
           PRODUCT GRID
           ============================================================ */
        .products-section {
            padding-bottom: clamp(48px, 6vw, 80px);
        }

        .products-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: clamp(20px, 3vw, 32px);
        }

        .products-label {
            font-size: clamp(13px, 1.4vw, 15px);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .products-count {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--surface);
            padding: 4px 12px;
            border-radius: 100px;
            border: 1px solid var(--border-light);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(16px, 2vw, 24px);
        }

        /* ============================================================
           PRODUCT CARD
           ============================================================ */
        .product-card {
            aspect-ratio: 1 / 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: clamp(20px, 2.5vw, 32px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-base);
            cursor: default;
        }

        .product-card:hover {
            background: var(--surface-hover);
            border-color: var(--border-strong);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .product-card:focus-within {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .product-icon-wrapper {
            width: clamp(56px, 7vw, 80px);
            height: clamp(56px, 7vw, 80px);
            border-radius: var(--radius-md);
            background: var(--white);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: clamp(12px, 2vw, 20px);
            overflow: hidden;
            flex-shrink: 0;
            transition: all var(--transition-base);
        }

        .product-card:hover .product-icon-wrapper {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .product-icon {
            width: 60%;
            height: 60%;
            object-fit: contain;
        }

        .product-icon-fallback {
            width: 60%;
            height: 60%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-icon-fallback svg {
            width: 100%;
            height: 100%;
        }

        .product-name {
            font-size: clamp(14px, 1.6vw, 17px);
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .product-description {
            font-size: clamp(11px, 1.2vw, 13px);
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: clamp(12px, 2vw, 18px);
            max-width: 90%;
        }

        .product-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 24px;
            background: var(--primary);
            color: var(--white);
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            letter-spacing: 0.01em;
            white-space: nowrap;
            min-width: 100px;
        }

        .product-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 76, 92, 0.25);
        }

        .product-btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .product-btn:active {
            transform: translateY(0);
        }

        .product-btn svg {
            width: 14px;
            height: 14px;
            transition: transform var(--transition-fast);
        }

        .product-btn:hover svg {
            transform: translateX(2px);
        }

        .product-btn--coming-soon {
            background: transparent;
            color: var(--accent);
            border: 1px solid rgba(232, 185, 49, 0.3);
            cursor: default;
        }

        .product-btn--coming-soon:hover {
            background: rgba(232, 185, 49, 0.08);
            transform: none;
            box-shadow: none;
        }

        .product-btn--disabled {
            background: var(--border-light);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .product-btn--disabled:hover {
            background: var(--border-light);
            transform: none;
            box-shadow: none;
        }

        .product-status {
            position: absolute;
            top: clamp(12px, 1.5vw, 16px);
            right: clamp(12px, 1.5vw, 16px);
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .product-status--available {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
        }

        .product-status--coming-soon {
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 185, 49, 0.2);
        }

        .product-status--disabled {
            background: var(--text-muted);
            box-shadow: 0 0 0 3px rgba(170, 170, 170, 0.15);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: clamp(60px, 10vw, 120px) clamp(20px, 4vw, 40px);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: var(--surface);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-light);
        }

        .empty-state-icon svg {
            width: 36px;
            height: 36px;
            color: var(--text-muted);
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-state-text {
            font-size: 15px;
            color: var(--text-muted);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            position: relative;
            z-index: 1;
            border-top: 1px solid var(--border-light);
            padding: clamp(20px, 3vw, 28px) 0;
        }

        .footer-inner {
            max-width: var(--max-content-width);
            margin: 0 auto;
            padding: 0 clamp(16px, 4vw, 40px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-text span {
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fade-in-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        /* ============================================================
           RESPONSIVE STYLES
           ============================================================ */

        /* Large Desktop / 4K */
        @media (min-width: 1920px) {
            .product-grid {
                gap: 28px;
            }
        }

        /* Desktop - 4 columns */
        @media (min-width: 1025px) and (max-width: 1919px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Tablet - 2 columns */
        @media (min-width: 640px) and (max-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            :root {
                --header-height: 64px;
            }
        }

        /* Mobile - 1 column */
        @media (max-width: 639px) {
            .product-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 0 auto;
            }

            :root {
                --header-height: 60px;
            }

            .header-logo,
            .header-logo-placeholder {
                width: 34px;
                height: 34px;
            }

            .welcome-title {
                font-size: 24px;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }

            #bg-canvas {
                opacity: 0.4;
            }
        }

        /* Small Mobile */
        @media (max-width: 374px) {
            .product-card {
                padding: 16px;
            }

            .product-icon-wrapper {
                width: 52px;
                height: 52px;
            }

            .welcome-title {
                font-size: 22px;
            }
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .product-card:hover {
                transform: none;
            }

            .product-btn:hover {
                transform: none;
            }
        }
    </style>
</head>

                icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Crect width='48' height='48' rx='12' fill='%230F4C5C'/%3E%3Cpath d='M16 8h12l8 8v24a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z' fill='white' opacity='.2'/%3E%3Cpath d='M28 8v8h8' stroke='%23E8B931' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='18' y1='24' x2='30' y2='24' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='18' y1='30' x2='30' y2='30' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='18' y1='36' x2='25' y2='36' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E",
                url: "https://example.com/documents",
                buttonLabel: "Open",
                openInNewTab: true,
                status: "coming-soon"
            },
            {
                name: "Support Desk",
                description: "Ticketing system and customer support tools",
                icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Crect width='48' height='48' rx='12' fill='%230F4C5C'/%3E%3Ccircle cx='24' cy='22' r='10' stroke='%23E8B931' stroke-width='2' fill='none'/%3E%3Cpath d='M20 22a4 4 0 0 1 8 0' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='20' r='1.2' fill='white'/%3E%3Ccircle cx='26' cy='20' r='1.2' fill='white'/%3E%3Cpath d='M21 24s1.5 2 3 2 3-2 3-2' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M18 34l-2 4h16l-2-4' stroke='%234ADE80' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E",
                url: "https://example.com/support",
                buttonLabel: "Visit",
                openInNewTab: true,
                status: "disabled"
            }
        ];

        /* ============================================================
           APPLICATION LOGIC
           ============================================================ */
        (function() {
            'use strict';

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ----- Apply Theme Colors ----- */
            function applyTheme() {
                const t = clientConfig.theme;
                const root = document.documentElement;
                root.style.setProperty('--primary', t.primary);
                root.style.setProperty('--primary-hover', t.primaryHover);
                root.style.setProperty('--accent', t.accent);
                root.style.setProperty('--success', t.success);
                root.style.setProperty('--background', t.background);
                root.style.setProperty('--surface', t.surface);
                root.style.setProperty('--surface-hover', t.surfaceHover);
                root.style.setProperty('--border', t.border);
                root.style.setProperty('--border-light', t.borderLight);
                root.style.setProperty('--border-strong', t.borderStrong);
                root.style.setProperty('--text-primary', t.textPrimary);
                root.style.setProperty('--text-secondary', t.textSecondary);
                root.style.setProperty('--text-muted', t.textMuted);
                root.style.setProperty('--header-background', t.headerBackground);
                root.style.setProperty('--white', t.white);
                root.style.setProperty('--white-transparent', t.whiteTransparent);
            }

            /* ----- Render Header ----- */
            function renderHeader() {
                const container = document.getElementById('header-content');
                const hasLogo = clientConfig.logo && clientConfig.logo !== 'YOUR_LOGO_URL_HERE';

                let logoHtml;
                if (hasLogo) {
                    logoHtml = `<img class="header-logo" src="${escapeAttr(clientConfig.logo)}" alt="${escapeAttr(clientConfig.companyName)} logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="header-logo-placeholder" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg></div>`;
                } else {
                    logoHtml = `<div class="header-logo-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M12 8v8"/></svg></div>`;
                }

                container.innerHTML = `
                    ${logoHtml}
                    <span class="header-name">${escapeHtml(clientConfig.companyName)}</span>
                `;

                document.title = `${clientConfig.companyName} — Product Portal`;
            }

            /* ----- Render Welcome Section ----- */
            function renderWelcome() {
                const container = document.getElementById('welcome-section');
                container.innerHTML = `
                    <div class="welcome-badge animate-in" style="animation-delay:0ms">
                        <span class="welcome-badge-dot"></span>
                        All Systems Operational
                    </div>
                    <h1 class="welcome-title animate-in" style="animation-delay:80ms">
                        Welcome to <span>${escapeHtml(clientConfig.companyName)}</span>
                    </h1>
                    <p class="welcome-subtitle animate-in" style="animation-delay:160ms">
                        ${escapeHtml(clientConfig.tagline)}
                    </p>
                `;
            }

            /* ----- Render Products ----- */
            function renderProducts() {
                const grid = document.getElementById('product-grid');
                const header = document.getElementById('products-header');
                const count = document.getElementById('products-count');

                if (products.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="3"/>
                                    <path d="M9 9h6M9 12h4"/>
                                </svg>
                            </div>
                            <h2 class="empty-state-title">No applications available</h2>
                            <p class="empty-state-text">Your business applications will appear here once they are enabled.</p>
                        </div>
                    `;
                    return;
                }

                header.style.display = 'flex';
                count.textContent = `${products.length} application${products.length !== 1 ? 's' : ''}`;

                grid.innerHTML = products.map((product, index) => {
                    const status = product.status || 'available';
                    const delay = index * 60;

                    let buttonHtml = '';
                    if (status === 'available') {
                        buttonHtml = `
                            <a href="${escapeAttr(product.url)}"
                               class="product-btn"
                               ${product.openInNewTab ? 'target="_blank" rel="noopener noreferrer"' : ''}
                               role="button"
                               aria-label="${escapeAttr(product.buttonLabel || 'Open')} ${escapeAttr(product.name)}">
                                ${escapeHtml(product.buttonLabel || 'Open')}
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 8h10M9 4l4 4-4 4"/>
                                </svg>
                            </a>
                        `;
                    } else if (status === 'coming-soon') {
                        buttonHtml = `
                            <span class="product-btn product-btn--coming-soon" aria-label="${escapeAttr(product.name)} is coming soon">
                                Coming Soon
                            </span>
                        `;
                    } else {
                        buttonHtml = `
                            <span class="product-btn product-btn--disabled" aria-label="${escapeAttr(product.name)} is unavailable">
                                Unavailable
                            </span>
                        `;
                    }

                    return `
                        <article class="product-card animate-in" style="animation-delay:${delay}ms" role="listitem" aria-label="${escapeAttr(product.name)}">
                            <span class="product-status product-status--${status}" aria-label="Status: ${status.replace('-', ' ')}"></span>
                            <div class="product-icon-wrapper">
                                <img class="product-icon"
                                     src="${escapeAttr(product.icon)}"
                                     alt="${escapeAttr(product.name)} icon"
                                     loading="lazy"
                                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                                <div class="product-icon-fallback" style="display:none">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round">
                                        <rect x="4" y="4" width="16" height="16" rx="3"/>
                                        <path d="M9 9h6M9 12h4"/>
                                    </svg>
                                </div>
                            </div>
                            <h3 class="product-name">${escapeHtml(product.name)}</h3>
                            <p class="product-description">${escapeHtml(product.description)}</p>
                            ${buttonHtml}
                        </article>
                    `;
                }).join('');
            }

            /* ----- Render Footer ----- */
            function renderFooter() {
                const container = document.getElementById('footer-content');
                const year = new Date().getFullYear();
                container.innerHTML = `
                    <span class="footer-text">&copy; ${year} ${escapeHtml(clientConfig.companyName)}</span>
                    <span class="footer-text">Powered by <span>${escapeHtml(clientConfig.saasName)}</span></span>
                `;
            }

            /* ----- HTML Escaping ----- */
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.appendChild(document.createTextNode(str));
                return div.innerHTML;
            }

            function escapeAttr(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            /* ----- Animated Background ----- */
            function initBackground() {
                if (prefersReducedMotion) {
                    const canvas = document.getElementById('bg-canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    drawStaticBackground(ctx, canvas.width, canvas.height);
                    return;
                }

                const canvas = document.getElementById('bg-canvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                let particles = [];
                let animationId;

                const PARTICLE_COUNT = 35;
                const CONNECTION_DISTANCE = 160;
                const COLORS = ['#0F4C5C', '#E8B931', '#4ADE80'];

                function resize() {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                }

                function createParticles() {
                    particles = [];
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push({
                            x: Math.random() * width,
                            y: Math.random() * height,
                            vx: (Math.random() - 0.5) * 0.3,
                            vy: (Math.random() - 0.5) * 0.3,
                            radius: Math.random() * 2 + 1,
                            color: COLORS[Math.floor(Math.random() * COLORS.length)],
                            opacity: Math.random() * 0.3 + 0.08
                        });
                    }
                }

                function drawStaticBackground(ctx, w, h) {
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        const x = Math.random() * w;
                        const y = Math.random() * h;
                        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                        ctx.beginPath();
                        ctx.arc(x, y, Math.random() * 2 + 1, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.globalAlpha = Math.random() * 0.15 + 0.05;
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }

                function animate() {
                    ctx.clearRect(0, 0, width, height);

                    for (let i = 0; i < particles.length; i++) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0) p.x = width;
                        if (p.x > width) p.x = 0;
                        if (p.y < 0) p.y = height;
                        if (p.y > height) p.y = 0;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.opacity;
                        ctx.fill();

                        for (let j = i + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dx = p.x - p2.x;
                            const dy = p.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < CONNECTION_DISTANCE) {
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = p.color;
                                ctx.globalAlpha = (1 - dist / CONNECTION_DISTANCE) * 0.06;
                                ctx.lineWidth = 0.8;
                                ctx.stroke();
                            }
                        }
                    }

                    ctx.globalAlpha = 1;
                    animationId = requestAnimationFrame(animate);
                }

                resize();
                createParticles();
                animate();

                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() {
                        resize();
                        createParticles();
                    }, 200);
                });
            }

            /* ----- Initialize ----- */
            function init() {
                applyTheme();
                renderHeader();
                renderWelcome();
                renderProducts();
                renderFooter();
                initBackground();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
